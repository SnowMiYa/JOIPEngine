name: Release Windows x64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.8.0). Leave empty to use v{version} from CMakeLists.txt'
        required: false
        type: string

env:
  # Match project README (5.14.x + msvc2017); 5.15 removed QFileDialogPrivate::workingDirectory
  QT_VERSION: '5.14.2'
  QT_ARCH: win64_msvc2017_64
  CMAKE_BUILD_TYPE: Release
  CCACHE_VERSION: '4.10.2'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: true
  CCACHE_COMPRESSLEVEL: 6
  CCACHE_MAXSIZE: 2G
  CCACHE_SLOPPINESS: time_macros,locale,pch_defines,include_file_mtime,include_file_ctime

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Perl and pkg-config
        run: |
          choco install strawberryperl pkgconfiglite -y --no-progress
          echo "C:\Program Files\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\pkgconfiglite\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup ccache
        shell: pwsh
        run: |
          $ver = $env:CCACHE_VERSION
          $url = "https://github.com/ccache/ccache/releases/download/v$ver/ccache-$ver-windows-x86_64.zip"
          $zip = "$env:RUNNER_TEMP/ccache.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $dest = "$env:RUNNER_TEMP/ccache"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $ccacheExe = Get-ChildItem $dest -Recurse -Filter "ccache.exe" | Select-Object -First 1
          if (-not $ccacheExe) { throw "ccache.exe not found in $dest" }
          echo "$($ccacheExe.DirectoryName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ccache --version
          ccache -z
          ccache -p

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: joip-ccache-${{ runner.os }}-qt${{ env.QT_VERSION }}-${{ hashFiles('.github/workflows/release-windows.yml') }}
          restore-keys: |
            joip-ccache-${{ runner.os }}-qt${{ env.QT_VERSION }}-
            joip-ccache-${{ runner.os }}-

      # Default install includes Qt Base / 3D / Multimedia / QML / etc.
      # `modules` is only for add-ons (qtcharts, qtwebengine, ...); see:
      #   aqt list-qt windows desktop --modules 5.14.2 win64_msvc2017_64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          cache: true
          install-deps: false
          setup-python: false

      - name: Stage QtAV FFmpeg deps for Qt
        shell: pwsh
        run: |
          $qt = $env:QT_ROOT_DIR
          $av = (Resolve-Path "3rdparty/QtAV/ffmpeg/QtAV-depends-windows-x86+x64").Path
          Copy-Item -Recurse -Force "$av/include/*" "$qt/include"
          Copy-Item -Recurse -Force "$av/lib/x64/*" "$qt/lib"
          if (Test-Path "$av/bin/x64") {
            Copy-Item -Force "$av/bin/x64/*.dll" "$qt/bin" -ErrorAction SilentlyContinue
          }

      - name: Build and install QtAV
        shell: pwsh
        run: |
          $jobs = [int]$env:NUMBER_OF_PROCESSORS
          Write-Host "Ninja parallel jobs: $jobs"
          # Best-effort only (QtAV CMake unchanged): expose depends headers/libs to MSVC probes
          $av = (Resolve-Path "3rdparty/QtAV/ffmpeg/QtAV-depends-windows-x86+x64").Path
          $env:INCLUDE = "$av/include;$env:QT_ROOT_DIR/include;$env:INCLUDE"
          $env:LIB = "$av/lib/x64;$env:QT_ROOT_DIR/lib;$env:LIB"
          Write-Host "::group::QtAV — CMake configure"
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DQTDIR="$env:QT_ROOT_DIR" `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_TESTS=OFF `
            -DBUILD_PLAYERS=OFF `
            -S 3rdparty/QtAV `
            -B build-qtav
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "::endgroup::"

          Write-Host "::group::QtAV — CMake build"
          cmake --build build-qtav --parallel $jobs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "::endgroup::"

          Write-Host "::group::QtAV — CMake install"
          cmake --install build-qtav
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "::endgroup::"

          Write-Host "::group::ccache stats (after QtAV)"
          ccache -s
          Write-Host "::endgroup::"

      - name: Build and install JOIPEngine
        shell: pwsh
        run: |
          $jobs = [int]$env:NUMBER_OF_PROCESSORS
          Write-Host "Ninja parallel jobs: $jobs"
          Write-Host "::group::JOIPEngine — CMake configure"
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -S . `
            -B build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "::endgroup::"

          Write-Host "::group::JOIPEngine — CMake build"
          cmake --build build --parallel $jobs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "::endgroup::"

          Write-Host "::group::JOIPEngine — CMake install"
          cmake --build build --target install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "::endgroup::"

          Write-Host "::group::ccache stats (final)"
          ccache -s
          Write-Host "::endgroup::"

      # README: cmake install leaves empty license/help and no buttplug docs;
      # JOIPDeploy also copies Qt5Quick* link artifacts (.prl/.lib) into bin/.
      - name: Finalize deploy package
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          $deploy = Join-Path (Resolve-Path build) "deploy"
          if (-not (Test-Path $deploy)) {
            throw "Deploy directory not found: $deploy"
          }

          function Copy-DeployFile([string]$DestRel, [string]$SrcRel) {
            $dest = Join-Path $deploy $DestRel
            $src = Join-Path $repo $SrcRel
            if (-not (Test-Path -LiteralPath $src)) {
              Write-Warning "Missing source, skipped: $SrcRel"
              return
            }
            $destDir = Split-Path -Parent $dest
            if ($destDir -and -not (Test-Path -LiteralPath $destDir)) {
              New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            }
            Copy-Item -LiteralPath $src -Destination $dest -Force
          }

          Write-Host "::group::Copy license files"
          $licenseFiles = @(
            @('license/LICENSE.txt', 'LICENSE.txt'),
            @('license/better-enums/LICENSE.md', '3rdparty/better-enums/LICENSE.md'),
            @('license/extra-cmake-modules/COPYING-CMAKE-SCRIPTS', 'cmake/extra-cmake-modules/COPYING-CMAKE-SCRIPTS'),
            @('license/fonts/CloisterBlackLicence.txt', 'resources/fonts/CloisterBlackLicence.txt'),
            @('license/fonts/End User Licence Agreement.txt', 'resources/fonts/End User Licence Agreement.txt'),
            @('license/fonts/Font License.txt', 'resources/fonts/Font License.txt'),
            @('license/img/Save License.txt', 'resources/style/img/Save License.txt'),
            @('license/img/spinner_copyright.txt', 'resources/gif/spinner_copyright.txt'),
            @('license/json/CODE_OF_CONDUCT.md', '3rdparty/json/CODE_OF_CONDUCT.md'),
            @('license/json/LICENSE.MIT', '3rdparty/json/LICENSE.MIT'),
            @('license/json-schema-validator/LICENSE', '3rdparty/json-schema-validator/LICENSE'),
            @('license/libqpcx/LICENSE.LGPL', '3rdparty/libqpcx/LICENSE.LGPL'),
            @('license/libqtlua/COPYING', '3rdparty/libqtlua-2.1/COPYING'),
            @('license/libqtlua/COPYING.LESSER', '3rdparty/libqtlua-2.1/COPYING.LESSER'),
            @('license/libzip/LICENSE', '3rdparty/libzip/LICENSE'),
            @('license/lua_sandbox/MIT-LICENSE.txt', '3rdparty/lua_sandbox/lua_sandbox/MIT-LICENSE.txt'),
            @('license/MRichTextEditor/LICENSE.LGPL', '3rdparty/MRichTextEditor/LICENSE.LGPL'),
            @('license/MRichTextEditor/LGPL_EXCEPTION.txt', '3rdparty/MRichTextEditor/LGPL_EXCEPTION.txt'),
            @('license/nodeeditor/LICENSE', '3rdparty/nodeeditor/LICENSE'),
            @('license/openssl/openssl_license.txt', '3rdparty/win_openssl/LICENSE'),
            @('license/physfs/LICENSE.txt', '3rdparty/physfs-3.0.2/LICENSE.txt'),
            @('license/QButtplug/LICENSE', '3rdparty/QButtplug/LICENSE'),
            @('license/qtav/gpl-3.0.txt', '3rdparty/QtAV/gpl-3.0.txt'),
            @('license/qtav/lgpl-2.1.txt', '3rdparty/QtAV/lgpl-2.1.txt'),
            @('license/SortFilterProxyModel/LICENSE', '3rdparty/SortFilterProxyModel/LICENSE'),
            @('license/syntax-highlighting/GPL-2.0-only.txt', '3rdparty/syntax-highlighting/LICENSES/GPL-2.0-only.txt'),
            @('license/syntax-highlighting/LGPL-2.0-only.txt', '3rdparty/syntax-highlighting/LICENSES/LGPL-2.0-only.txt'),
            @('license/syntax-highlighting/LGPL-2.0-or-later.txt', '3rdparty/syntax-highlighting/LICENSES/LGPL-2.0-or-later.txt'),
            @('license/syntax-highlighting/LGPL-2.1-or-later.txt', '3rdparty/syntax-highlighting/LICENSES/LGPL-2.1-or-later.txt'),
            @('license/syntax-highlighting/MIT.txt', '3rdparty/syntax-highlighting/LICENSES/MIT.txt'),
            @('license/WinToast/LICENSE.txt', '3rdparty/WinToast/LICENSE.txt'),
            @('license/xmldom/LICENSE', '3rdparty/xmldom/LICENSE'),
            @('license/xmldom/readme.md', '3rdparty/xmldom/readme.md'),
            @('license/zlib/LICENSE', '3rdparty/zlib-1.3/LICENSE')
          )
          foreach ($pair in $licenseFiles) {
            Copy-DeployFile $pair[0] $pair[1]
          }
          $luaDoc = Join-Path $repo '3rdparty/Lua/lua-5.4.4/doc'
          if (Test-Path -LiteralPath $luaDoc) {
            Copy-Item -LiteralPath $luaDoc -Destination (Join-Path $deploy 'license/Lua') -Recurse -Force
          } else {
            Write-Warning 'Missing Lua doc folder: 3rdparty/Lua/lua-5.4.4/doc'
          }
          Write-Host "::endgroup::"

          Write-Host "::group::Copy help and buttplug plugin docs"
          $helpSrc = Join-Path $repo 'resources/help'
          if (Test-Path -LiteralPath $helpSrc) {
            Copy-Item -LiteralPath $helpSrc -Destination (Join-Path $deploy 'help') -Recurse -Force
          }
          $buttplug = Join-Path $deploy 'plugins/buttplug'
          New-Item -ItemType Directory -Path $buttplug -Force | Out-Null
          Copy-DeployFile 'plugins/buttplug/README.md' '3rdparty/intiface-engine/README.md'
          Copy-DeployFile 'plugins/buttplug/CHANGELOG.md' '3rdparty/intiface-engine/CHANGELOG.md'
          New-Item -ItemType Directory -Path (Join-Path $deploy 'data') -Force | Out-Null
          Write-Host "::endgroup::"

          Write-Host "::group::Remove non-runtime build artifacts"
          $bin = Join-Path $deploy 'bin'
          if (Test-Path -LiteralPath $bin) {
            Get-ChildItem -LiteralPath $bin -File -Recurse | Where-Object {
              $_.Extension -in '.lib', '.prl', '.exp'
            } | ForEach-Object {
              Write-Host "Removing $($_.FullName.Substring($deploy.Length + 1))"
              Remove-Item -LiteralPath $_.FullName -Force
            }
          }
          $lib = Join-Path $deploy 'lib'
          if (Test-Path -LiteralPath $lib) {
            Get-ChildItem -LiteralPath $lib -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Removing $($_.FullName.Substring($deploy.Length + 1))"
              Remove-Item -LiteralPath $_.FullName -Force
            }
            if (-not (Get-ChildItem -LiteralPath $lib -Force -ErrorAction SilentlyContinue)) {
              Remove-Item -LiteralPath $lib -Force -Recurse
            }
          }
          Write-Host "::endgroup::"

          Write-Host "Deploy summary:"
          Get-ChildItem -LiteralPath $deploy -Directory | ForEach-Object {
            $count = (Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object).Count
            Write-Host "  $($_.Name)/ : $count files"
          }

      - name: Resolve version and package name
        id: meta
        shell: pwsh
        run: |
          $major = (Select-String -Path CMakeLists.txt -Pattern 'set\(JOIP_VERSION_MAJOR (\d+)\)' | ForEach-Object { $_.Matches.Groups[1].Value })
          $minor = (Select-String -Path CMakeLists.txt -Pattern 'set\(JOIP_VERSION_MINOR (\d+)\)' | ForEach-Object { $_.Matches.Groups[1].Value })
          $patch = (Select-String -Path CMakeLists.txt -Pattern 'set\(JOIP_VERSION_PATCH (\d+)\)' | ForEach-Object { $_.Matches.Groups[1].Value })
          $version = "$major.$minor.$patch"
          $tag = '${{ inputs.release_tag }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "v$version"
          }
          $asset = "JOIPEngine-$version-windows-x64.zip"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Create zip package
        shell: pwsh
        run: |
          $deploy = Join-Path (Resolve-Path build) "deploy"
          if (-not (Test-Path $deploy)) {
            throw "Deploy directory not found: $deploy"
          }
          $zip = "${{ steps.meta.outputs.asset }}"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $deploy '*') -DestinationPath $zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.asset }}
          path: ${{ steps.meta.outputs.asset }}
          if-no-files-found: error

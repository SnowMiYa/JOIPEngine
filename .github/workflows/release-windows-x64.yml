name: Release Windows x64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.8.0). Leave empty to use v{version} from CMakeLists.txt'
        required: false
        type: string

env:
  QT_VERSION: '5.15.2'
  QT_ARCH: win64_msvc2019_64
  CMAKE_BUILD_TYPE: Release

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Perl and pkg-config
        run: |
          choco install strawberryperl pkgconfiglite -y --no-progress
          echo "C:\Program Files\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\pkgconfiglite\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Default install includes Qt Base / 3D / Multimedia / QML / etc.
      # `modules` is only for add-ons (qtcharts, qtwebengine, ...); see:
      #   aqt list-qt windows desktop --modules 5.15.2 win64_msvc2019_64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          cache: true
          install-deps: false
          setup-python: false

      - name: Stage QtAV FFmpeg deps for Qt
        shell: pwsh
        run: |
          $qt = $env:QT_ROOT_DIR
          $av = (Resolve-Path "3rdparty/QtAV/ffmpeg/QtAV-depends-windows-x86+x64").Path
          Copy-Item -Recurse -Force "$av/include/*" "$qt/include"
          Copy-Item -Recurse -Force "$av/lib/x64/*" "$qt/lib"
          if (Test-Path "$av/bin/x64") {
            Copy-Item -Force "$av/bin/x64/*.dll" "$qt/bin" -ErrorAction SilentlyContinue
          }

      - name: Build and install QtAV
        shell: pwsh
        run: |
          # Best-effort only (QtAV CMake unchanged): expose depends headers/libs to MSVC probes
          $av = (Resolve-Path "3rdparty/QtAV/ffmpeg/QtAV-depends-windows-x86+x64").Path
          $env:INCLUDE = "$av/include;$env:QT_ROOT_DIR/include;$env:INCLUDE"
          $env:LIB = "$av/lib/x64;$env:QT_ROOT_DIR/lib;$env:LIB"
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DQTDIR="$env:QT_ROOT_DIR" `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_TESTS=OFF `
            -DBUILD_PLAYERS=OFF `
            -S 3rdparty/QtAV `
            -B build-qtav
          cmake --build build-qtav --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build-qtav

      - name: Build and install JOIPEngine
        shell: pwsh
        run: |
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -S . `
            -B build
          cmake --build build --parallel
          cmake --build build --target install

      - name: Resolve version and package name
        id: meta
        shell: pwsh
        run: |
          $major = (Select-String -Path CMakeLists.txt -Pattern 'set\(JOIP_VERSION_MAJOR (\d+)\)' | ForEach-Object { $_.Matches.Groups[1].Value })
          $minor = (Select-String -Path CMakeLists.txt -Pattern 'set\(JOIP_VERSION_MINOR (\d+)\)' | ForEach-Object { $_.Matches.Groups[1].Value })
          $patch = (Select-String -Path CMakeLists.txt -Pattern 'set\(JOIP_VERSION_PATCH (\d+)\)' | ForEach-Object { $_.Matches.Groups[1].Value })
          $version = "$major.$minor.$patch"
          $tag = '${{ inputs.release_tag }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "v$version"
          }
          $asset = "JOIPEngine-$version-windows-x64.zip"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Create zip package
        shell: pwsh
        run: |
          $deploy = Join-Path (Resolve-Path build) "deploy"
          if (-not (Test-Path $deploy)) {
            throw "Deploy directory not found: $deploy"
          }
          $zip = "${{ steps.meta.outputs.asset }}"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $deploy '*') -DestinationPath $zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.asset }}
          path: ${{ steps.meta.outputs.asset }}
          if-no-files-found: error
